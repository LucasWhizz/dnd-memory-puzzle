
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Test of Sequence</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0c0b12;
  color: #f3e9d9;
  font-family: Georgia, serif;
  text-align: center;
}

p {
  line-height: 1.5;
}

/* MAIN ROOM */

#map {
  position: relative;
  width: min(95vw, 750px);
  margin: 20px auto;
}

#map img {
  display: block;
  width: 100%;
}

/* CLICKABLE DOORS */

.door {
  position: absolute;
  width: 13%;
  height: 15%;
  background: transparent;
  border: 2px solid transparent;
  border-radius: 8px;
  cursor: pointer;
}

.door:hover,
.door:focus-visible {
  border-color: #e79cf5;
  background: #df80ed33;
  outline: none;
}

/* PINK CRYSTAL COUNTER */

#crystalCounter {
  position: absolute;
  left: 50%;
  top: 38%;
  transform: translate(-50%, -50%);
  color: #ff9aeb;
  font-size: clamp(18px, 3vw, 30px);
  font-weight: bold;
  text-shadow:
    0 0 6px #ff69db,
    0 0 15px #f049d5,
    0 0 25px #e038cc;
  white-space: nowrap;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  transition: opacity 1s ease-in-out;
}

#crystalCounter.visible {
  opacity: 1;
}

/* DOOR AND MEMORY SCREENS */

#panel {
  max-width: 750px;
  margin: 20px auto;
  padding: 12px;
}

#panel img {
  display: block;
  max-width: 100%;
  max-height: 65vh;
  margin: 15px auto;
  object-fit: contain;
}

/* DOOR DESCRIPTION */

#doorDescription {
  color: #f0d8f4;
  font-size: 21px;
  margin: 18px auto;
  line-height: 1.6;
}

/* CLICKABLE DOOR IMAGE */

#symbolButton {
  display: block;
  width: fit-content;
  margin: auto;
  padding: 0;
  border: 2px solid #dca5ee;
  background: transparent;
  cursor: pointer;
}

#symbolButton img {
  margin: 0;
}

/* FANTASY BUTTONS */

button.fantasy-button {
  display: inline-block;
  margin: 20px 8px;
  padding: 13px 30px;
  background: linear-gradient(
    180deg,
    #513725 0%,
    #302016 50%,
    #21150f 100%
  );
  color: #f0d5a0;
  border: 2px solid #b89253;
  border-radius: 5px;
  box-shadow:
    inset 0 0 0 2px #28190f,
    inset 0 2px 8px #8b603b,
    0 5px 15px #0009;
  font-family: Georgia, serif;
  font-size: 19px;
  font-variant: small-caps;
  letter-spacing: 2px;
  text-shadow: 1px 1px 3px #000;
  cursor: pointer;
  transition:
    box-shadow 0.3s ease,
    background 0.3s ease,
    transform 0.3s ease;
}

button.fantasy-button::before {
  content: "❧";
  margin-right: 12px;
  color: #d5ad69;
}

button.fantasy-button::after {
  content: "❧";
  margin-left: 12px;
  color: #d5ad69;
}

button.fantasy-button:hover {
  background: linear-gradient(
    180deg,
    #6d4b30,
    #402b1b,
    #302016
  );
  box-shadow:
    inset 0 0 0 2px #28190f,
    0 0 16px #d5a65c88,
    0 5px 15px #0009;
  transform: translateY(-2px);
}

button.fantasy-button:active {
  transform: translateY(1px);
}

/* FADE OVERLAY */

#fadeOverlay {
  position: fixed;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
  transition: opacity 0.6s ease-in-out;
}

#fadeOverlay.active {
  opacity: 1;
  pointer-events: all;
}

/* FINAL SEQUENCE SCREEN */

#finalScreen {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

/* GLOWING PINK MESSAGE */

#finalMessage {
  max-width: 850px;
  color: #ff9aeb;
  font-size: clamp(24px, 4vw, 38px);
  font-weight: bold;
  line-height: 1.6;
  text-align: center;

  text-shadow:
    0 0 8px #ff69db,
    0 0 20px #f049d5,
    0 0 35px #e038cc;

  opacity: 0;
  transition: opacity 1.5s ease-in-out;
}

#finalMessage.visible {
  opacity: 1;
}

/* FINAL FOG IMAGE */

#fogScreen {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #000;
}

#fogScreen img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<!-- CINEMATIC FADE OVERLAY -->

<div id="fadeOverlay"></div>

<!-- MAIN ROOM -->

<section id="roomView">

  <div id="map">

    <img src="images/room.png" alt="The chamber">

    <div id="crystalCounter" aria-live="polite"></div>

    <!-- LEFT SIDE -->

    <!-- Door 1: Bottom Left -->
    <button class="door" data-door="1"
      style="left:8%;top:71%"
      aria-label="Bottom left door"></button>

    <!-- Door 2: Middle Left -->
    <button class="door" data-door="2"
      style="left:8%;top:48%"
      aria-label="Middle left door"></button>

    <!-- Door 3: Top Left -->
    <button class="door" data-door="3"
      style="left:8%;top:25%"
      aria-label="Top left door"></button>

    <!-- RIGHT SIDE -->

    <!-- Door 4: Top Right -->
    <button class="door" data-door="4"
      style="left:79%;top:25%"
      aria-label="Top right door"></button>

    <!-- Door 5: Middle Right -->
    <button class="door" data-door="5"
      style="left:79%;top:48%"
      aria-label="Middle right door"></button>

    <!-- Door 6: Bottom Right -->
    <button class="door" data-door="6"
      style="left:79%;top:71%"
      aria-label="Bottom right door"></button>

  </div>

</section>

<!-- DOOR AND MEMORY SCREENS -->

<section id="panel" hidden>

  <div id="doorView">

    <p id="doorDescription"></p>

    <button id="symbolButton"
      onclick="showMemory()"
      aria-label="Touch the symbol to reveal the memory">

      <img id="doorImage"
        alt="A wooden door with an engraved symbol">

    </button>

  </div>

  <div id="memoryView" hidden>

    <h2>A Vision</h2>

    <img id="memoryImage"
      alt="A vision from the party's journey">

    <button class="fantasy-button" onclick="enterDoor()">
      Enter the Door
    </button>

    <button class="fantasy-button" onclick="showRoom()">
      Return
    </button>

  </div>

  <div id="doorReturn">

    <button class="fantasy-button" onclick="showRoom()">
      Return
    </button>

  </div>

</section>

<!-- FINAL SUCCESS MESSAGE -->

<section id="finalScreen" hidden>

  <div id="finalMessage">
    Sequence confirmed. Do you want to enter the lobby
    of the Cannith Vault or travel elsewhere through
    the veil?
  </div>

</section>

<!-- FINAL WALL OF FOG -->

<section id="fogScreen" hidden>

  <img src="images/fog.png"
    alt="A mysterious wall of swirling fog">

</section>

<script>

// ==================================================
// PUZZLE CONFIGURATION
// ==================================================

const correctOrder = [6, 4, 3, 1, 5, 2];

const doorDescriptions = {
  1: "A wooden door with the symbol of a Tigers Head. Do you remember?",
  2: "A wooden door with the symbol of a Robotic Arm. Do you remember?",
  3: "A wooden door with the symbol of a Bow. Do you remember?",
  4: "A wooden door with the symbol of a Bear. Do you remember?",
  5: "A wooden door with the symbol of a PickAxe. Do you remember?",
  6: "A wooden door with the symbol of a Crystal. Do you remember?"
};

// ==================================================
// TIMING SETTINGS (MILLISECONDS)
// ==================================================

const fadeDuration = 600;
const counterDuration = 6000;
const finalMessageDuration = 10000;
const finalMessageFade = 1500;

// ==================================================
// PUZZLE STATE
// ==================================================

let selected = [];
let activeDoor = null;
let puzzleComplete = false;
let transitioning = false;
let counterTimer = null;

// ==================================================
// ELEMENTS
// ==================================================

const roomView = document.getElementById("roomView");
const panel = document.getElementById("panel");
const doorView = document.getElementById("doorView");
const memoryView = document.getElementById("memoryView");
const doorReturn = document.getElementById("doorReturn");

const crystalCounter =
  document.getElementById("crystalCounter");

const fadeOverlay =
  document.getElementById("fadeOverlay");

const finalScreen =
  document.getElementById("finalScreen");

const finalMessage =
  document.getElementById("finalMessage");

const fogScreen =
  document.getElementById("fogScreen");

// ==================================================
// CLICK HANDLERS
// ==================================================

document.querySelectorAll(".door").forEach(button => {

  button.addEventListener("click", () => {
    openDoor(Number(button.dataset.door));
  });

});

// ==================================================
// OPEN DOOR
// ==================================================

function openDoor(number) {

  if (puzzleComplete || transitioning) return;

  clearTimeout(counterTimer);
  crystalCounter.classList.remove("visible");

  activeDoor = number;

  roomView.hidden = true;
  panel.hidden = false;

  doorView.hidden = false;
  memoryView.hidden = true;
  doorReturn.hidden = false;

  document.getElementById("doorDescription").textContent =
    doorDescriptions[number];

  document.getElementById("doorImage").src =
    `images/door${number}.png`;

}

// ==================================================
// REVEAL MEMORY
// ==================================================

function showMemory() {

  if (transitioning) return;

  doorView.hidden = true;
  memoryView.hidden = false;
  doorReturn.hidden = true;

  document.getElementById("memoryImage").src =
    `images/memory${activeDoor}.png`;

}

// ==================================================
// DISPLAY CRYSTAL COUNTER
// ==================================================

function displayCounter(text) {

  clearTimeout(counterTimer);

  crystalCounter.textContent = text;
  crystalCounter.classList.add("visible");

  counterTimer = setTimeout(() => {

    crystalCounter.classList.remove("visible");

  }, counterDuration);

}

// ==================================================
// NORMAL RETURN TO MAIN ROOM
// ==================================================

function showRoom(counterText = null) {

  if (transitioning || puzzleComplete) return;

  transitioning = true;

  fadeOverlay.classList.add("active");

  setTimeout(() => {

    roomView.hidden = false;
    panel.hidden = true;

    fadeOverlay.classList.remove("active");

    setTimeout(() => {

      transitioning = false;

      if (typeof counterText === "string") {
        displayCounter(counterText);
      }

    }, fadeDuration);

  }, fadeDuration);

}

// ==================================================
// ENTER SELECTED DOOR
// ==================================================

function enterDoor() {

  if (puzzleComplete || transitioning) return;

  const expectedDoor = correctOrder[selected.length];

  if (activeDoor === expectedDoor) {

    // CORRECT DOOR

    selected.push(activeDoor);

    if (selected.length === 6) {

      // ALL SIX CORRECT
      puzzleComplete = true;

      startFinalSequence();
      return;

    }

    showRoom(`${selected.length}/6`);

  } else {

    // INCORRECT DOOR

    selected = [];

    showRoom("Recall... 0/6");

  }

}

// ==================================================
// FINAL CINEMATIC SEQUENCE
// ==================================================

function startFinalSequence() {

  transitioning = true;

  clearTimeout(counterTimer);
  crystalCounter.classList.remove("visible");

  // STEP 1: FADE MEMORY SCREEN TO BLACK

  fadeOverlay.classList.add("active");

  setTimeout(() => {

    // STEP 2: SWITCH TO BLACK MESSAGE SCREEN

    roomView.hidden = true;
    panel.hidden = true;
    finalScreen.hidden = false;

    // Remove overlay to reveal black screen
    fadeOverlay.classList.remove("active");

    // Allow the browser to render the new screen
    requestAnimationFrame(() => {

      requestAnimationFrame(() => {

        // STEP 3: FADE IN PINK MESSAGE

        finalMessage.classList.add("visible");

      });

    });

    // STEP 4: WAIT 10 SECONDS

    setTimeout(() => {

      // Fade the message away
      finalMessage.classList.remove("visible");

      setTimeout(() => {

        // STEP 5: FADE TO BLACK AGAIN

        fadeOverlay.classList.add("active");

        setTimeout(() => {

          // STEP 6: SHOW WALL OF FOG

          finalScreen.hidden = true;
          fogScreen.hidden = false;

          // Fade black overlay away
          fadeOverlay.classList.remove("active");

          setTimeout(() => {
            transitioning = false;
          }, fadeDuration);

        }, fadeDuration);

      }, finalMessageFade);

    }, finalMessageDuration);

  }, fadeDuration);

}

</script>

</body>
</html>
