
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Test of Sequence</title>

<style>

/* GENERAL STYLING */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0c0b12;
  color: #f3e9d9;
  font-family: Georgia, serif;
  text-align: center;
}

p {
  line-height: 1.5;
}

/* MAIN ROOM */

#map {
  position: relative;
  width: min(95vw, 750px);
  margin: 20px auto;
}

#map img {
  display: block;
  width: 100%;
}

/* CLICKABLE DOORS */

.door {
  position: absolute;
  width: 13%;
  height: 15%;
  background: transparent;
  border: 2px solid transparent;
  border-radius: 8px;
  cursor: pointer;
}

.door:hover,
.door:focus-visible {
  border-color: #e79cf5;
  background: #df80ed33;
  outline: none;
}

/* PINK CRYSTAL COUNTER */

#crystalCounter {
  position: absolute;
  left: 50%;
  top: 38%;
  transform: translate(-50%, -50%);

  color: #ff9aeb;
  font-size: clamp(18px, 3vw, 30px);
  font-weight: bold;

  text-shadow:
    0 0 6px #ff69db,
    0 0 15px #f049d5,
    0 0 25px #e038cc;

  white-space: nowrap;
  pointer-events: none;
  z-index: 5;

  opacity: 0;
  transition: opacity 1s ease-in-out;
}

#crystalCounter.visible {
  opacity: 1;
}

/* DOOR AND MEMORY SCREENS */

#panel {
  max-width: 750px;
  margin: 20px auto;
  padding: 12px;
}

#panel img {
  display: block;
  max-width: 100%;
  max-height: 65vh;
  margin: 15px auto;
  object-fit: contain;
}

/* DOOR DESCRIPTION */

#doorDescription {
  color: #f0d8f4;
  font-size: 21px;
  margin: 18px auto;
  line-height: 1.6;
}

/* CLICKABLE DOOR IMAGE */

#symbolButton {
  display: block;
  width: fit-content;
  margin: auto;
  padding: 0;
  border: 2px solid #dca5ee;
  background: transparent;
  cursor: pointer;
}

#symbolButton img {
  margin: 0;
}

/* ACTION BUTTONS */

button.action {
  background: #352044;
  border: 1px solid #b97bcb;
  border-radius: 7px;
  color: white;
  padding: 12px 20px;
  margin: 8px;
  cursor: pointer;
  font: inherit;
}

button.action:hover {
  background: #573267;
}

button.enter {
  background: #60316e;
  border-color: #e4a0f1;
}

button.enter:hover {
  background: #854397;
}

/* SUCCESS MESSAGE */

#successMessage {
  color: #f2b5ff;
  font-size: 22px;
  text-shadow: 0 0 12px #e86bfa;
  margin: 20px auto;
}

/* CINEMATIC FADE TRANSITION */

#fadeOverlay {
  position: fixed;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
  transition: opacity 0.6s ease-in-out;
}

#fadeOverlay.active {
  opacity: 1;
  pointer-events: all;
}

[hidden] {
  display: none !important;
}

</style>
</head>

<body>

<!-- FADE OVERLAY -->

<div id="fadeOverlay"></div>

<!-- MAIN ROOM -->

<section id="roomView">

  <div id="map">

    <img src="images/room.png" alt="The chamber">

    <!-- CRYSTAL COUNTER -->

    <div id="crystalCounter" aria-live="polite"></div>

    <!-- LEFT SIDE -->

    <!-- Door 1: Bottom Left -->
    <button class="door" data-door="1"
      style="left:8%;top:71%"
      aria-label="Bottom left door"></button>

    <!-- Door 2: Middle Left -->
    <button class="door" data-door="2"
      style="left:8%;top:48%"
      aria-label="Middle left door"></button>

    <!-- Door 3: Top Left -->
    <button class="door" data-door="3"
      style="left:8%;top:25%"
      aria-label="Top left door"></button>

    <!-- RIGHT SIDE -->

    <!-- Door 4: Top Right -->
    <button class="door" data-door="4"
      style="left:79%;top:25%"
      aria-label="Top right door"></button>

    <!-- Door 5: Middle Right -->
    <button class="door" data-door="5"
      style="left:79%;top:48%"
      aria-label="Middle right door"></button>

    <!-- Door 6: Bottom Right -->
    <button class="door" data-door="6"
      style="left:79%;top:71%"
      aria-label="Bottom right door"></button>

  </div>

  <div id="successMessage" hidden>
    Presence of mind confirmed. Access granted.
  </div>

</section>

<!-- DOOR AND MEMORY SCREENS -->

<section id="panel" hidden>

  <!-- DOOR IMAGE -->

  <div id="doorView">

    <p id="doorDescription"></p>

    <button id="symbolButton"
      onclick="showMemory()"
      aria-label="Touch the symbol to reveal the memory">

      <img id="doorImage"
        alt="A wooden door with an engraved symbol">

    </button>

  </div>

  <!-- MEMORY IMAGE -->

  <div id="memoryView" hidden>

    <h2>A Vision</h2>

    <img id="memoryImage"
      alt="A vision from the party's journey">

    <button class="action enter" onclick="enterDoor()">
      Enter the Door
    </button>

    <button class="action" onclick="showRoom()">
      Return to Room
    </button>

  </div>

  <!-- RETURN BUTTON FOR DOOR VIEW -->

  <div id="doorReturn">
    <button class="action" onclick="showRoom()">
      Return to Room
    </button>
  </div>

</section>

<script>

// ==================================================
// CORRECT SEQUENCE
// ==================================================

const correctOrder = [6, 4, 3, 1, 5, 2];

// ==================================================
// DOOR DESCRIPTIONS
// ==================================================

const doorDescriptions = {

  1: "A wooden door with the symbol of a Tigers Head. Do you remember?",

  2: "A wooden door with the symbol of a Robotic Arm. Do you remember?",

  3: "A wooden door with the symbol of a Bow. Do you remember?",

  4: "A wooden door with the symbol of a Bear. Do you remember?",

  5: "A wooden door with the symbol of a PickAxe. Do you remember?",

  6: "A wooden door with the symbol of a Crystal. Do you remember?"

};

// ==================================================
// PUZZLE STATE
// ==================================================

let selected = [];
let activeDoor = null;
let puzzleComplete = false;
let transitioning = false;
let counterTimer = null;

const roomView = document.getElementById("roomView");
const panel = document.getElementById("panel");
const doorView = document.getElementById("doorView");
const memoryView = document.getElementById("memoryView");

const crystalCounter =
  document.getElementById("crystalCounter");

const successMessage =
  document.getElementById("successMessage");

const doorReturn =
  document.getElementById("doorReturn");

const fadeOverlay =
  document.getElementById("fadeOverlay");

// ==================================================
// DOOR CLICK HANDLERS
// ==================================================

document.querySelectorAll(".door").forEach(button => {

  button.addEventListener("click", () => {
    openDoor(Number(button.dataset.door));
  });

});

// ==================================================
// OPEN DOOR IMAGE
// ==================================================

function openDoor(number) {

  if (puzzleComplete || transitioning) return;

  clearTimeout(counterTimer);
  crystalCounter.classList.remove("visible");

  activeDoor = number;

  roomView.hidden = true;
  panel.hidden = false;

  doorView.hidden = false;
  memoryView.hidden = true;
  doorReturn.hidden = false;

  document.getElementById("doorDescription").textContent =
    doorDescriptions[number];

  document.getElementById("doorImage").src =
    `images/door${number}.png`;

}

// ==================================================
// SHOW MEMORY
// ==================================================

function showMemory() {

  if (transitioning) return;

  doorView.hidden = true;
  memoryView.hidden = false;
  doorReturn.hidden = true;

  document.getElementById("memoryImage").src =
    `images/memory${activeDoor}.png`;

}

// ==================================================
// DISPLAY COUNTER FOR SIX SECONDS
// ==================================================

function displayCounter(text) {

  clearTimeout(counterTimer);

  crystalCounter.textContent = text;

  crystalCounter.classList.add("visible");

  counterTimer = setTimeout(() => {
    crystalCounter.classList.remove("visible");
  }, 6000);

}

// ==================================================
// FADE BACK TO MAIN ROOM
// ==================================================

function showRoom(counterText = null) {

  if (transitioning) return;

  transitioning = true;

  fadeOverlay.classList.add("active");

  setTimeout(() => {

    roomView.hidden = false;
    panel.hidden = true;

    fadeOverlay.classList.remove("active");

    setTimeout(() => {

      transitioning = false;

      if (typeof counterText === "string") {
        displayCounter(counterText);
      }

    }, 600);

  }, 600);

}

// ==================================================
// ENTER THE SELECTED DOOR
// ==================================================

function enterDoor() {

  if (puzzleComplete || transitioning) return;

  const expectedDoor = correctOrder[selected.length];

  let counterText;

  if (activeDoor === expectedDoor) {

    selected.push(activeDoor);

    counterText = `${selected.length}/6`;

    if (selected.length === 6) {

      puzzleComplete = true;

      counterText = "6/6";

      successMessage.hidden = false;

    }

  } else {

    selected = [];

    counterText = "Recall... 0/6";

  }

  showRoom(counterText);

}

</script>

</body>
</html>
